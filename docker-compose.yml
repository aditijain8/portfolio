# Local development stack: PostgreSQL + Spring Boot API + built frontend (nginx).
#   cp .env.example .env   # then fill in the placeholders
#   docker compose up --build
# Site: http://localhost:5173   API (direct): http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/portfolio
      DB_USERNAME: portfolio
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_RESET: ${ADMIN_RESET:-false}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      STORAGE_TYPE: ${STORAGE_TYPE:-database}
      COOKIE_SECURE: "false"          # plain HTTP locally; MUST be true behind HTTPS in production
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      CONTACT_ENABLED: ${CONTACT_ENABLED:-true}
    volumes:
      - uploads:/app/data
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "5173:80"

volumes:
  pgdata:
  uploads:
